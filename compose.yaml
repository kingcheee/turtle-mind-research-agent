# 연구비 판정관 — docker compose up -d --build → http://localhost:8080 (포트는 WEB_PORT로 바꾼다)
# 첫 실행 때 llm 컨테이너가 모델(Qwen2.5-1.5B-Instruct Q4_K_M, 약 1.1GB)을 Hugging Face에서 받아 models 볼륨에 둔다. 그 뒤로는 받지 않는다.
services:
  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    command: ["-hf", "Qwen/Qwen2.5-1.5B-Instruct-GGUF:Q4_K_M", "--port", "8080", "-c", "2048"]
    volumes:
      - models:/root/.cache
    healthcheck:            # 검사 명령은 이미지 것(curl /health) 그대로 — 모델을 받는 동안 unhealthy로 뜨지 않게 여유만 준다
      start_period: 30m
      interval: 10s
    restart: unless-stopped

  web:
    build: .
    environment:
      LLAMA_URL: http://llm:8080
    ports:
      - "${WEB_PORT:-8080}:8080"
    volumes:
      - data:/app/data      # DB·업로드·생성 보고서. 처음 만들 때 이미지의 data/(과제 설정·시연 사진)가 복사된다
    depends_on:
      - llm
    restart: unless-stopped

volumes:
  models:
  data:
